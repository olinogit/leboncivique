name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: La banque de questions ne doit pas être dans le dépôt
        run: |
          if git ls-files | grep -E '(^|/)questions[^/]*\.json$|\.seed\.sql$|^seed/|^private/'; then
            echo "::error::Fichier de banque de questions détecté dans le dépôt."; exit 1
          fi
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Aucun script ni style en ligne dans les pages générées (CSP stricte)
        run: |
          if grep -rlP '<script(?![^>]*(src=|type="application/ld\+json"))' --include='*.html' dist; then
            echo "::error::Script en ligne détecté : il serait bloqué par la CSP."; exit 1
          fi
          if grep -rlE '<style|style="' --include='*.html' dist; then
            echo "::error::Style en ligne détecté : il serait bloqué par la CSP."; exit 1
          fi
      - name: Audit des dépendances
        run: npm audit --audit-level=high

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: semgrep scan --config p/default --config p/typescript --config p/secrets --error --metrics=off
